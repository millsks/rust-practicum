# Parses fine (every name exists), but `a -> b -> c -> a` loops, and `selfish` depends on itself.

[workspace]
name = "loops"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
start = { cmd = "echo start", depends-on = ["b"] }
a = { cmd = "echo a", depends-on = ["b"] }
b = { cmd = "echo b", depends-on = ["c"] }
c = { cmd = "echo c", depends-on = ["a"] }
selfish = { cmd = "echo me", depends-on = ["selfish"] }
fine = "echo fine"
