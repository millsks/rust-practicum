[package]
name = "manifest_reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Capstone 1 of the Rust Practicum: read a simplified pixi.toml into typed Rust structs."
license = "MIT"
publish = false

# An empty workspace table makes this crate its own workspace root, so Cargo never looks for a parent workspace.
[workspace]

[[bin]]
name = "manifest-reader"
path = "src/main.rs"

[dependencies]
toml = "1.1.8"
