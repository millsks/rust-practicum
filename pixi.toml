[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "rust-practicum"
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.14.*"
structlog = ">=26.1.0,<27"
# The Rust toolchain the course teaches, pinned to the version the Pixi codebase builds with (rust-toolchain: 1.95.0).
rust = ">=1.95,<1.96"

[pypi-dependencies]
rust-practicum = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=9,<10"
pytest-cov = ">=7,<8"
mypy = ">=2,<3"
ruff = ">=0.15,<1"
pre-commit = ">=4,<5"
git-cliff = ">=2,<3"
python-build = ">=1,<2"
hatchling = ">=1,<2"
act = ">=0.2,<0.3"

[environments]
default = { features = ["dev"], solve-group = "default" }

[activation.env]
# One shared target directory, so capstone builds are cached between grading runs.
CARGO_TARGET_DIR = "$PIXI_PROJECT_ROOT/target"

[tasks]
bootstrap = "pre-commit install --install-hooks && pre-commit install --hook-type commit-msg"
fmt = "ruff format ."
lint = "ruff check ."
check = "mypy src/"
test = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
cov = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90"
build = "python -m build --no-isolation"
changelog = "git cliff -o CHANGELOG.md"
act = "act --container-architecture linux/amd64"
pre-commit-all = "pre-commit run --all-files"
lint-rust = "practicum lint-rust"
ci = { depends-on = ["pre-commit-all", "build", "check", "lint", "lint-rust", "cov"] }

# Learner workflow
serve = "practicum serve"
projects = "practicum list"
start = "practicum start"
grade = "practicum grade"
check-site = "practicum check-site"
check-exercises = "practicum check-exercises"
bundle = "practicum bundle"
